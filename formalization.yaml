# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "coherent-modules"
  description: >-
    Coherent rings and modules, finite-presentation criteria, exact-sequence
    closure, localization and descent, coherent-module categories, universal
    coherence, Hom and tensor-product closure, finite square-zero kernels and
    projection base change, finite-type ideal/module transfer, left Noetherianity
    under scalar clearing, pointwise unimodular finite-generation ascent for
    semilinear maps, and generator bounds for semilinear images in Lean.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Coherent rings, coherent modules and finite presentation"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Classical mathematical constructions using native mathlib modules,
      finite presentations, exactness, localization, square-zero extensions,
      tensor products and category theory.
      No mathematical novelty or human-author endorsement is claimed.
  - title: "Semilinear Noetherian ascent under scalar clearing"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      A semilinear map between semimodules over arbitrary semirings transfers
      Noetherianity when each target element can be cleared into the image by
      a scalar with a left inverse. Unit clearing and function-surjectivity
      are corollaries. No scalar-homomorphism surjectivity is assumed. For regular
      semimodules, this recovers left Noetherianity under unit clearing; the
      companion ideal theorem identifies extension of contraction.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating coherent-ring/module mathematics. Exact passage correspondence,
      additional source hypotheses and remaining gaps are recorded separately;
      this metadata makes no source-coverage or whole-source completion claim.

