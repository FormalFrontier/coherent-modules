# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/v0.4.schema.json
version: "v0.4"

project:
  name: "coherent-modules"
  description: >-
    Coherent rings and modules, finite-presentation criteria, exact-sequence
    closure, localization and descent, coherent-module categories, universal
    coherence, and Hom and tensor-product closure in Lean.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Formal Frontier source-maintainer team"
  license: "Apache-2.0"

sources:
  - title: "Coherent rings, coherent modules and finite presentation"
    type: "folklore"
    relationship: "independently-proves"
    note: >-
      Classical mathematical constructions using native mathlib modules,
      finite presentations, exactness, localization and category theory.
      No mathematical novelty or human-author endorsement is claimed.
  - title: "Foundations of Rigid Geometry I"
    authors:
      - "Kazuhiro Fujiwara"
      - "Fumiharu Kato"
    id: "https://arxiv.org/abs/1308.4734v5"
    type: "book"
    relationship: "background"
    note: >-
      Motivating coherent-ring/module mathematics. Exact passage correspondence,
      additional source hypotheses and remaining gaps are recorded separately;
      this metadata makes no source-coverage or whole-source completion claim.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Native module, finite-presentation, localization, tensor and category APIs
      at revision 83abb3e776bdefcbc447a1e44d0debe4010039e5,
      with Lean v4.34.0-rc2 and the complete pinned Lake dependency graph.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier AI agents using Lean, Lake and Git for development,
        assembly, review and maintenance.
  notes: >-
    Original project contributions and upstream/tooling provenance are summarized
    in docs/CREDITS.md. Review and verification apply to exact revisions; AI-agent
    participation does not imply human peer review or source-author endorsement.

status:
  scope: >-
    Reusable coherence and finite-presentation results with each declaration's
    actual Ring or CommRing hypotheses and independent module universes.
    Universal coherence explicitly records its target-algebra universe.
    Hom/tensor closure remains theorem-based, with a finitely presented first
    argument and coherent second argument. No nontriviality or nonzero-module
    assumptions or complete source coverage is asserted.

review:
  status: "other: revision-specific independent AI-agent review"
  notes: >-
    Review and acceptance are recorded for exact revisions in the project's
    maintained release records. Changes require independent review and
    applicable build, proof-integrity, rights and provenance evidence before
    acceptance; this field does not certify any arbitrary checkout or replace
    that evidence. AI-agent review is not human peer review, legal certification,
    source-author endorsement or complete source formalization.

acknowledgements: >-
  Lean and mathlib authors for the proof assistant and native infrastructure;
  Anchor and other Formal Frontier AI-agent contributors for original development,
  review and later adaptations. Collective author credit does not identify a
  copyright holder or itself resolve third-party redistribution rights.
