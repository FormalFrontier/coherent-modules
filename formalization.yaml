acknowledgements: >-
  Lean and mathlib authors for the proof assistant and native infrastructure;
  Anchor and the attributed Formalization Worker A and B executions for original
  development, review and later adaptations. Collective project credit does not
  identify a copyright holder or clear third-party material for redistribution.
