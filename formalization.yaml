status:
  scope: >-
    Reusable coherence and finite-presentation results with each declaration's
    actual algebraic hypotheses and independent module universes.
    Universal coherence explicitly records its target-algebra universe.
    For left ideals I over a possibly noncommutative semiring and arbitrary
    submodules N and P of an additive commutative semimodule, the relative bound
    P ≤ N ⊔ I • P persists along every ideal power. Global nilpotence of I then
    gives P ≤ N, without finite generation, additive inverses, cancellation or
    nontriviality; the scalar and module universes are independent.
    Hom/tensor closure remains theorem-based, with a finitely presented first
    argument and coherent second argument. Square-zero kernel and projection
    base-change results hold over commutative semirings and additive commutative
    modules; kernel finiteness requires a finite module, while base change does
    not. Ideal/module predicate transfer is over finite-type algebras of a
    commutative ring, assuming isomorphism invariance and descent along every
    compatible surjective square-zero algebra map. The base universe is independent
    of the common algebra/module universe. Semilinear image bounds hold over
    arbitrary semirings without assuming surjectivity of the scalar homomorphism.
    The natural-valued generator bound assumes finite generation of the source.
    A target submodule is finitely generated when its comap is finitely generated
    and, for each of its elements n, the scalars a with f m = a • n for some m
    generate the unit left ideal. Without finite generation, the same condition
    identifies the target submodule with the target-scalar span of its comap
    image. The single-left-inverse and unit-clearing criteria are specializations;
    at the top submodule the existing criteria transfer module-finiteness from
    the source. No Noetherianity or scalar-homomorphism surjectivity is required.
    Scalar-clearing ascent uses arbitrary source and target semirings and additive
    commutative semimodules in four independent universes, with witnesses
    b * a = 1 and f m = a • n for each target element n. Comap reflects submodule
    order. Unit clearing and function-surjectivity specialize this result; regular
    semimodules recover ring Noetherianity, alongside ideal extension/contraction.
    Finite-submodule adic cofinality concerns finitely generated submodules of
    finite original modules over a commutative ring, without finite presentation
    of the ambient module or finite generation of the ideal. Its eliminator
    allows independent ring and module universes. Nilpotent ideals and ideals
    of Noetherian rings satisfy the property. The full module Artin–Rees theorem
    only assumes Noetherianity of the original module, not of the ring.
    Colons of radical ideals by arbitrary subsets are radical over commutative
    semirings. Taking the zero ideal over a reduced commutative semiring gives
    radical pointwise annihilators, including empty subsets and zero rings.
    For commutative semirings R and S, a submonoid T of R and an R-algebra S
    realizing localization at T, extension followed by contraction commutes
    with colon by a finitely generated ideal J. The numerator ideal I is
    arbitrary; finite generation of J does not mean its underlying set is
    finite. The two universes are independent, and zero semirings, zero in T,
    the zero ideal J and top ideals are allowed.
    For commutative semirings R and A and a standard localized-module map
    from M to N, extension of the annihilator of M is the annihilator of N
    when M is finitely generated over R. The additive commutative monoids
    carry their given R-module structures and N has its compatible A-action;
    all four carrier universes are independent. Zero modules, zero semirings
    and zero in the localizing submonoid are retained, without finite
    presentation, faithful action or an added flatness hypothesis. Equality
    after localization for two maps from a finitely generated semimodule is
    equivalent to equality after multiplying both maps by one element of
    the localizing submonoid.
    No coherence, projectivity, nontriviality or nonzero-module assumption or
    complete source coverage is asserted.

