name = "coherent-modules"
version = "0.1.0"
defaultTargets = ["CoherentModules", "CoherentModulesTest", "CoherentModulesExamples.DirectSum", "CoherentModulesExamples.FinitePresentation"]
lintDriver = "batteries/runLinter"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "homological_algebra"
git = "https://github.com/FormalFrontier/homological-algebra.git"
rev = "6c7f755cf87e91faff497a7da85e4ddfed431613"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[lean_lib]]
name = "CoherentModules"

[[lean_lib]]
name = "CoherentModulesTest"
globs = ["CoherentModulesTest", "CoherentModulesTest.+"]
# Compatibility checks in the test library intentionally stay private.
leanOptions = { weak.linter.privateModule = false }

[[lean_lib]]
name = "CoherentModulesExamples.DirectSum"
globs = ["CoherentModulesExamples.+"]
